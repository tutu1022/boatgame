<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPU認定成績 | ボートレース水都</title>
  <link rel="stylesheet" href="./results.css">
  <script src="./results.js" type="module"></script>
</head>
<body>
<main>
  <a href="../" class="back">‹ ボートレース水都</a>
  <header><h1>CPU認定成績</h1><label>認定回 <select id="round" aria-label="認定回"></select></label></header>
  <p id="state" role="status">成績を読み込んでいます</p>
  <section id="content" hidden>
    <h2>級別の勝率</h2>
    <div class="scroll" id="tiers"></div>
    <section id="detail" aria-live="polite">
      <header><h2 id="selected"></h2><label>受験CPU <select id="contender" aria-label="受験CPU"></select></label><label>認定マッチ <select id="phase" aria-label="認定マッチ"></select></label></header>
      <p id="record"></p>
      <h3>枠別成績</h3><div class="scroll" id="lanes"></div>
      <header><h3>全出走と対戦相手</h3><label>自艇の枠 <select id="lane"><option value="0">すべて</option></select></label></header>
      <div class="scroll" id="races"></div>
    </section>
    <p id="history"></p>
    <a id="download" download>採用20艇の対戦記録を保存（JSON）</a>
  </section>
</main>
</body>
</html>
