<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ボートレース" />
    <meta name="theme-color" content="#6aa6dc" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>ボートレース水都</title>
    <script type="module" crossorigin src="./assets/index-ByOLTpeg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CXMDU14p.css">
  </head>
  <body>
    <div id="app"></div>
    <div id="touch"></div>
    <div id="lean-pad" class="pad"><div class="knob"></div><span>体重</span></div>
    <div id="steer-pad" class="pad steer" hidden><div class="knob"></div><span>ハンドル</span></div>
    <div id="wheel" aria-label="ハンドルの切れ角">
      <svg viewBox="0 0 120 120">
        <path class="w-range" d="M 6 60 A 54 54 0 0 1 114 60" />
        <path class="w-fill" id="wheel-fill" d="M 60 6 A 54 54 0 0 1 60 6" />
        <path class="w-tick" d="M 60 1 V 11 M 1 60 H 11 M 109 60 H 119" />
        <g id="wheel-rot">
          <circle class="w-ring" cx="60" cy="60" r="38" />
          <path class="w-spoke" d="M 22 60 H 98 M 60 60 V 98" />
          <circle class="w-hub" cx="60" cy="60" r="9" />
          <circle class="w-mark" cx="60" cy="22" r="6" />
        </g>
      </svg>
      <div id="wheel-label">0°</div>
    </div>
    <div id="lever"><div class="track"><div class="fill"></div><div class="knob"></div></div><span>レバー</span></div>
    <div id="hud">
      <div class="speed"><span id="speed">0</span><small>km/h</small></div>
      <div class="tach" id="tach"><div class="tach-bar"><i id="m-rpm"></i></div><span id="rpm">0</span><small>rpm</small></div>
      <div class="meta" id="meta"></div>
      <div class="chips"><span class="chip cav" id="chip-cav">キャビ 0%</span><span class="chip vent" id="chip-vent">吸い込み 0%</span></div>
    </div>
    <div id="buttons">
      <button id="b-cam">視点</button>
      <button id="b-wave">波高 3cm</button>
      <button id="b-center" hidden>傾きを中央に</button>
      <button id="b-prop">セッティング</button>
      <button id="b-reset">リセット</button>
    </div>
    <!-- セッティングの画面（中身は src/settings.ts が作る。メニューの中に置く・走る画面の右上に浮かべる） -->
    <div id="prop-panel" hidden></div>
    <div id="banner"></div>
    <div id="rotate">横向きにするとプレイしやすくなります</div>
  </body>
</html>
